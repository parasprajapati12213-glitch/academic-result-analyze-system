<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="100%" height="100%">
  <defs>
    <linearGradient id="pGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Geometric Faceted Diamond/Prism Star Emblem (from MITS PDF) -->
  <g transform="translate(10, 5)">
    <!-- Top-left facet -->
    <polygon points="30,5 30,30 10,22" fill="url(#pCyan)"/>
    <!-- Top-right facet -->
    <polygon points="30,5 50,22 30,30" fill="url(#pGreen)"/>
    <!-- Far right facet -->
    <polygon points="50,22 30,30 45,45" fill="url(#pOrange)"/>
    <!-- Bottom facet -->
    <polygon points="30,30 45,45 30,55 15,45" fill="url(#pRed)"/>
    <!-- Far left facet -->
    <polygon points="10,22 30,30 15,45" fill="url(#pPurple)"/>
  </g>

  <!-- MITS Typography -->
  <text x="75" y="44" font-family="'Times New Roman', serif, 'Georgia'" font-size="36" font-weight="bold" fill="#0f172a" letter-spacing="3">
    MITS
  </text>
  
  <!-- Subtle baseline accent rules -->
  <rect x="75" y="52" width="120" height="2" fill="#d97706"/>
  <rect x="75" y="56" width="70" height="1.5" fill="#2563eb"/>
  <text x="76" y="66" font-family="'Segoe UI', -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" letter-spacing="1">
    GWALIOR · DEEMED UNIVERSITY
  </text>
</svg>
