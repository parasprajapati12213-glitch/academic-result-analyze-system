<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Result Analyzer – Marks Entry</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet"/>
  <script src="app.js"></script>
  <script src="leo_chatbot.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cyan:#00F0FF;--blue:#00A3FF;--sky:#38BDF8;--navy:#030712;--glass:rgba(6,18,38,0.70);--border:rgba(56,189,248,0.20);--soft:rgba(255,255,255,0.87);--muted:rgba(186,230,253,0.60);--r:14px}
    html,body{height:100%;font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#030712,#050C1A 50%,#071428);color:#fff;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,240,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.03) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0}
    #appNav{position:relative;z-index:200}
    .page{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:28px 20px 70px}
    .pg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .pg-header h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#fff,var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .btn{display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:9px;border:none;cursor:pointer;transition:all .2s}
    .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#030712}
    .btn-primary:hover{opacity:.88;transform:translateY(-1px)}
    .btn-secondary{background:rgba(56,189,248,0.10);border:1px solid rgba(56,189,248,0.28);color:var(--sky)}
    .btn-secondary:hover{background:rgba(56,189,248,0.20)}

    /* Selector card */
    .sel-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:24px;backdrop-filter:blur(14px);margin-bottom:20px}
    .sel-card h3{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px}
    .sel-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
    @media(max-width:600px){.sel-grid{grid-template-columns:1fr}}
    .form-field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
    .form-field select,.form-field input{width:100%;padding:10px 14px;background:rgba(2,10,24,0.70);border:1px solid rgba(56,189,248,0.22);border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s}
    .form-field select:focus,.form-field input:focus{border-color:var(--cyan)}

    /* Student info strip */
    .stu-strip{background:linear-gradient(90deg,rgba(0,163,255,0.10),rgba(0,240,255,0.06));border:1px solid rgba(0,240,255,0.20);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
    .stu-strip .stu-name{font-size:16px;font-weight:700;color:#fff}
    .stu-strip .stu-meta{font-size:13px;color:var(--muted)}
    .stu-strip .stu-badge{font-size:12px;padding:4px 12px;border-radius:12px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.28);color:var(--sky);font-weight:700}

    /* Marks table */
    .marks-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(14px)}
    .marks-card-head{background:linear-gradient(90deg,#1B365D,#14274f);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
    .marks-card-head h3{font-size:15px;font-weight:700;color:#fff}
    table{width:100%;border-collapse:collapse;font-size:14px}
    thead th{background:#1B365D;padding:11px 16px;text-align:left;font-weight:700;font-size:12px;color:#fff;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
    tbody tr{border-bottom:1px solid rgba(56,189,248,0.10);transition:background .18s}
    tbody tr:hover{background:rgba(0,240,255,0.04)}
    tbody td{padding:10px 16px;color:var(--soft);vertical-align:middle}

    /* Mark inputs */
    .mark-input{width:80px;padding:7px 10px;background:rgba(2,10,24,0.70);border:1px solid rgba(56,189,248,0.22);border-radius:7px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;text-align:center;outline:none;transition:border .2s}
    .mark-input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,240,255,0.12)}
    .mark-input.err{border-color:#f87171;background:rgba(239,68,68,0.08)}
    .total-cell{font-size:16px;font-weight:800}
    .grade-cell{font-size:14px;font-weight:700}

    /* Summary bar */
    .summary-bar{background:linear-gradient(90deg,rgba(6,18,38,0.90),rgba(6,18,38,0.70));border-top:2px solid rgba(0,240,255,0.18);padding:16px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    .sum-item{text-align:center}
    .sum-val{font-size:22px;font-weight:800;color:var(--cyan)}
    .sum-label{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}

    /* Toast */
    .toast{position:fixed;bottom:28px;right:24px;background:#071428;border:1px solid rgba(0,240,255,0.35);border-radius:12px;padding:14px 20px;color:#fff;font-size:14px;font-weight:600;z-index:999;transform:translateY(80px);opacity:0;transition:all .35s;max-width:320px}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{border-color:rgba(74,222,128,0.45);color:#4ade80}
    .toast.error{border-color:rgba(239,68,68,0.45);color:#f87171}

    .no-data{text-align:center;padding:48px;color:var(--muted);font-size:14px}
    .no-data span{display:block;font-size:40px;margin-bottom:10px}
  </style>
</head>
<body>
<div id="appNav"></div>
<div class="toast" id="toast"></div>

<main class="page">
  <div class="pg-header">
    <div><h1>✏️ Marks Entry</h1></div>
  </div>

  <!-- Selector -->
  <div class="sel-card">
    <h3>Select Student & Semester</h3>
    <div class="sel-grid">
      <div class="form-field">
        <label>Student</label>
        <select id="stuSel" onchange="onStudentChange()">
          <option value="">— Choose Student —</option>
        </select>
      </div>
      <div class="form-field">
        <label>Semester</label>
        <select id="semSel" onchange="loadMarks()">
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3" selected>Semester 3</option>
        </select>
      </div>
      <button class="btn btn-secondary" onclick="loadMarks()">🔄 Load</button>
    </div>
  </div>

  <!-- Student strip -->
  <div class="stu-strip" id="stuStrip" style="display:none">
    <div>
      <div class="stu-name" id="stuStripName">—</div>
      <div class="stu-meta" id="stuStripMeta">—</div>
    </div>
    <span class="stu-badge" id="stuStripSem">—</span>
    <span class="stu-badge" id="stuStripCGPA" style="margin-left:auto">CGPA: —</span>
  </div>

  <!-- Marks form -->
  <div id="marksSection" style="display:none">
    <div class="marks-card">
      <div class="marks-card-head">
        <h3 id="marksCardTitle">Marks — Semester 3</h3>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" onclick="clearAllMarks()" style="font-size:12px;padding:6px 12px">🗑️ Clear</button>
          <button class="btn btn-primary" onclick="saveMarks()" style="font-size:12px;padding:6px 14px">💾 Save Marks</button>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Subject Name</th>
              <th>Credits</th>
              <th>Internal (50)</th>
              <th>External (50)</th>
              <th>Total (100)</th>
              <th>Grade</th>
              <th>Grade Pts</th>
            </tr>
          </thead>
          <tbody id="marksBody"></tbody>
        </table>
      </div>
      <div class="summary-bar" id="summaryBar">
        <div class="sum-item"><div class="sum-val" id="sumSGPA">—</div><div class="sum-label">SGPA</div></div>
        <div class="sum-item"><div class="sum-val" id="sumCGPA">—</div><div class="sum-label">CGPA</div></div>
        <div class="sum-item"><div class="sum-val" id="sumCredits">—</div><div class="sum-label">Total Credits</div></div>
        <div class="sum-item"><div class="sum-val" id="sumPassed">—</div><div class="sum-label">Subjects Passed</div></div>
      </div>
    </div>
  </div>

  <div id="emptyState" class="no-data" style="margin-top:24px">
    <span>☝️</span>Select a student and semester above to enter or view marks.
  </div>
</main>

<script>
  initPage('marks');

  // Populate student dropdown
  function populateStudents() {
    const sel = document.getElementById('stuSel');
    const students = RA.getStudents().slice().sort((a,b)=>a.rollNo.localeCompare(b.rollNo));
    sel.innerHTML = '<option value="">— Choose Student —</option>' +
      students.map(s => '<option value="' + s.id + '">' + RA.escHTML(s.rollNo + ' — ' + s.name) + '</option>').join('');

    // Handle URL param ?sid=
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('sid');
    if (sid) { sel.value = sid; onStudentChange(); }
  }

  function onStudentChange() {
    const sid = document.getElementById('stuSel').value;
    if (!sid) { document.getElementById('stuStrip').style.display='none'; hideMarks(); return; }
    const s = RA.getStudent(sid);
    if (!s) return;
    document.getElementById('semSel').value = String(s.currentSem);
    showStripFor(s);
    loadMarks();
  }

  function showStripFor(s) {
    const cgpa = RA.calcCGPA(s.id);
    document.getElementById('stuStrip').style.display    = 'flex';
    document.getElementById('stuStripName').textContent  = s.name;
    document.getElementById('stuStripMeta').textContent  = s.rollNo + ' · ' + s.branch;
    document.getElementById('stuStripSem').textContent   = 'Semester ' + s.currentSem;
    document.getElementById('stuStripCGPA').textContent  = 'CGPA: ' + (cgpa > 0 ? cgpa.toFixed(2) : '—');
  }

  function hideMarks() {
    document.getElementById('marksSection').style.display = 'none';
    document.getElementById('emptyState').style.display   = 'block';
  }

  function loadMarks() {
    const sid = document.getElementById('stuSel').value;
    const sem = +document.getElementById('semSel').value;
    const catalog = RA.SUBJECT_CATALOG[sem];
    if (!sid || !catalog) { hideMarks(); return; }

    const s = RA.getStudent(sid);
    if (s) showStripFor(s);

    document.getElementById('emptyState').style.display   = 'none';
    document.getElementById('marksSection').style.display = 'block';
    document.getElementById('marksCardTitle').textContent = 'Marks — Semester ' + sem;

    const existing = RA.getMarksForStudentSem(sid, sem);

    const tbody = document.getElementById('marksBody');
    tbody.innerHTML = catalog.map(sub => {
      const ex = existing ? existing.subjects.find(s => s.code === sub.code) : null;
      const intV = ex ? ex.internal : '';
      const extV = ex ? ex.external : '';
      const tot  = ex ? ex.total    : '—';
      const g    = ex ? RA.getGrade(ex.total) : null;
      const totStyle = g ? 'color:' + RA.gradeColor(g.grade) : 'color:var(--muted)';
      return '<tr>' +
        '<td><strong style="color:var(--sky)">' + sub.code + '</strong></td>' +
        '<td>' + RA.escHTML(sub.name) + '</td>' +
        '<td style="text-align:center;color:var(--muted)">' + sub.credits + '</td>' +
        '<td><input class="mark-input" data-code="' + sub.code + '" data-type="int" type="number" min="0" max="50" value="' + intV + '" oninput="recalcRow(this)" placeholder="0"/></td>' +
        '<td><input class="mark-input" data-code="' + sub.code + '" data-type="ext" type="number" min="0" max="50" value="' + extV + '" oninput="recalcRow(this)" placeholder="0"/></td>' +
        '<td class="total-cell" id="tot_' + sub.code + '" style="' + totStyle + '">' + (ex ? ex.total : '—') + '</td>' +
        '<td class="grade-cell" id="grade_' + sub.code + '" style="color:' + (g ? RA.gradeColor(g.grade) : 'var(--muted)') + '">' + (g ? g.grade : '—') + '</td>' +
        '<td id="gp_' + sub.code + '" style="color:var(--muted)">' + (g ? g.points : '—') + '</td>' +
      '</tr>';
    }).join('');

    updateSummary();
  }

  function recalcRow(inp) {
    const code = inp.dataset.code;
    const sem  = +document.getElementById('semSel').value;
    const cat  = RA.SUBJECT_CATALOG[sem].find(s => s.code === code);
    const row  = inp.closest('tr');

    const intEl = row.querySelector('[data-type="int"]');
    const extEl = row.querySelector('[data-type="ext"]');
    let intV = parseFloat(intEl.value);
    let extV = parseFloat(extEl.value);

    // Validate ranges
    if (intV > 50) { intEl.value = 50; intV = 50; }
    if (extV > 50) { extEl.value = 50; extV = 50; }
    if (intV < 0)  { intEl.value = 0;  intV = 0;  }
    if (extV < 0)  { extEl.value = 0;  extV = 0;  }

    const haveBoth = !isNaN(intV) && !isNaN(extV);
    const total = haveBoth ? intV + extV : NaN;

    const totEl   = document.getElementById('tot_' + code);
    const gradeEl = document.getElementById('grade_' + code);
    const gpEl    = document.getElementById('gp_' + code);

    if (haveBoth) {
      const g = RA.getGrade(total);
      totEl.textContent   = total;
      totEl.style.color   = RA.gradeColor(g.grade);
      gradeEl.textContent = g.grade;
      gradeEl.style.color = RA.gradeColor(g.grade);
      gpEl.textContent    = g.points;
    } else {
      totEl.textContent   = '—';
      totEl.style.color   = 'var(--muted)';
      gradeEl.textContent = '—';
      gradeEl.style.color = 'var(--muted)';
      gpEl.textContent    = '—';
    }
    updateSummary();
  }

  function updateSummary() {
    const sem     = +document.getElementById('semSel').value;
    const catalog = RA.SUBJECT_CATALOG[sem] || [];
    const rows    = catalog.map(sub => {
      const row  = document.querySelector('[data-code="' + sub.code + '"][data-type="int"]');
      const row2 = document.querySelector('[data-code="' + sub.code + '"][data-type="ext"]');
      if (!row || !row2) return null;
      const intV = parseFloat(row.value), extV = parseFloat(row2.value);
      if (isNaN(intV) || isNaN(extV)) return null;
      return { credits: sub.credits, total: intV + extV };
    }).filter(Boolean);

    const sgpa    = rows.length ? RA.calcSGPA(rows) : 0;
    const passed  = rows.filter(r => r.total >= 40).length;
    const credits = rows.reduce((a,b) => a + b.credits, 0);

    document.getElementById('sumSGPA').textContent    = rows.length ? sgpa.toFixed(2) : '—';
    document.getElementById('sumCredits').textContent = rows.length ? credits : '—';
    document.getElementById('sumPassed').textContent  = rows.length ? passed + '/' + rows.length : '—';

    // CGPA (uses saved data + this sem)
    const sid = document.getElementById('stuSel').value;
    if (sid) {
      const cgpa = RA.calcCGPA(sid);
      document.getElementById('sumCGPA').textContent = cgpa > 0 ? cgpa.toFixed(2) : '—';
    }
  }

  function saveMarks() {
    const sid     = document.getElementById('stuSel').value;
    const sem     = +document.getElementById('semSel').value;
    const catalog = RA.SUBJECT_CATALOG[sem] || [];
    if (!sid) { showToast('Please select a student first.', 'error'); return; }

    const subjects = [];
    let hasAny = false;

    for (const sub of catalog) {
      const intEl = document.querySelector('[data-code="' + sub.code + '"][data-type="int"]');
      const extEl = document.querySelector('[data-code="' + sub.code + '"][data-type="ext"]');
      const intV  = parseFloat(intEl.value);
      const extV  = parseFloat(extEl.value);

      if (isNaN(intV) && isNaN(extV)) {
        subjects.push({ code: sub.code, name: sub.name, credits: sub.credits, internal: 0, external: 0, total: 0 });
      } else {
        hasAny = true;
        const i = isNaN(intV) ? 0 : Math.min(50, Math.max(0, intV));
        const e = isNaN(extV) ? 0 : Math.min(50, Math.max(0, extV));
        subjects.push({ code: sub.code, name: sub.name, credits: sub.credits, internal: i, external: e, total: i + e });
      }
    }

    if (!hasAny) { showToast('Please enter at least one subject\'s marks.', 'error'); return; }

    RA.saveMarks(sid, sem, subjects);
    // refresh cgpa
    const s = RA.getStudent(sid);
    if (s) showStripFor(s);
    document.getElementById('stuStripCGPA').textContent = 'CGPA: ' + RA.calcCGPA(sid).toFixed(2);
    showToast('✅ Marks saved successfully!', 'success');
  }

  function clearAllMarks() {
    document.querySelectorAll('.mark-input').forEach(inp => { inp.value = ''; });
    document.querySelectorAll('.total-cell, .grade-cell').forEach(el => { el.textContent = '—'; el.style.color = 'var(--muted)'; });
    document.querySelectorAll('[id^="gp_"]').forEach(el => { el.textContent = '—'; });
    updateSummary();
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent  = msg;
    t.className    = 'toast ' + (type || '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  populateStudents();
</script>
</body>
</html>
