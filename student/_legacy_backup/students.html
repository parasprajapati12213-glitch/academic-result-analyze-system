<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Result Analyzer – Students</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet"/>
  <script src="app.js"></script>
  <script src="leo_chatbot.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cyan:#00F0FF;--blue:#00A3FF;--sky:#38BDF8;--navy:#030712;--navy2:#050C1A;--glass:rgba(6,18,38,0.70);--border:rgba(56,189,248,0.20);--soft:rgba(255,255,255,0.87);--muted:rgba(186,230,253,0.60);--r:14px}
    html,body{height:100%;font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#030712,#050C1A 50%,#071428);color:#fff;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,240,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.03) 1px,transparent 1px);background-size:52px 52px;pointer-events:none;z-index:0}
    #appNav{position:relative;z-index:200}
    .page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px 20px 70px}
    .pg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
    .pg-header h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#fff,var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .btn{display:inline-flex;align-items:center;gap:7px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:9px;border:none;cursor:pointer;transition:all .2s;text-decoration:none}
    .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#030712}
    .btn-primary:hover{opacity:.88;transform:translateY(-1px)}
    .btn-danger{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);color:#f87171}
    .btn-danger:hover{background:rgba(239,68,68,0.22)}
    .btn-sm{padding:6px 12px;font-size:12px}
    .btn-edit{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);color:var(--sky)}
    .btn-edit:hover{background:rgba(56,189,248,0.2)}

    /* Search/filter bar */
    .filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .search-wrap{position:relative;flex:1;min-width:200px}
    .search-wrap input{width:100%;padding:9px 14px 9px 36px;background:rgba(5,12,26,0.80);border:1px solid rgba(56,189,248,0.25);border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;transition:border .2s}
    .search-wrap input:focus{border-color:var(--cyan)}
    .search-wrap::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
    select{background:rgba(5,12,26,0.85);border:1px solid rgba(56,189,248,0.25);border-radius:8px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;cursor:pointer}
    select:focus{border-color:var(--cyan)}

    /* Table card */
    .table-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(14px)}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    thead th{background:#1B365D;padding:12px 16px;text-align:left;font-weight:700;font-size:12px;color:#fff;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none}
    thead th:hover{background:#1f3f6a}
    tbody tr{border-bottom:1px solid rgba(56,189,248,0.10);transition:background .18s}
    tbody tr:hover{background:rgba(0,240,255,0.06)}
    tbody td{padding:12px 16px;color:var(--soft);vertical-align:middle}
    .sem-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:rgba(56,189,248,0.10);border:1px solid rgba(56,189,248,0.25);color:var(--sky)}
    .no-data{text-align:center;padding:48px;color:var(--muted);font-size:14px}
    .no-data span{display:block;font-size:40px;margin-bottom:10px}
    .action-btns{display:flex;gap:6px;align-items:center}

    /* Count badge */
    .count-badge{background:rgba(0,240,255,0.10);border:1px solid rgba(0,240,255,0.22);color:var(--cyan);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}

    /* ── Modal ── */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:500;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal{background:linear-gradient(160deg,#071428,#050C1A);border:1px solid rgba(0,240,255,0.25);border-radius:18px;padding:32px 28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.7)}
    .modal h2{font-size:18px;font-weight:800;color:var(--cyan);margin-bottom:24px}
    .form-row{margin-bottom:16px}
    .form-row label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
    .form-row input,.form-row select{width:100%;padding:11px 14px;background:rgba(2,10,24,0.70);border:1px solid rgba(56,189,248,0.25);border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s}
    .form-row input:focus,.form-row select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,0.10)}
    .form-row input::placeholder{color:rgba(186,230,253,0.35)}
    .modal-btns{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
    .btn-cancel{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.7)}
    .btn-cancel:hover{background:rgba(255,255,255,0.10)}
    .err-msg{color:#f87171;font-size:12.5px;margin-top:16px;display:none}

    /* Confirm dialog */
    .confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:600;align-items:center;justify-content:center;padding:20px}
    .confirm-overlay.open{display:flex}
    .confirm-box{background:#071428;border:1px solid rgba(239,68,68,0.35);border-radius:14px;padding:28px 24px;max-width:380px;width:100%;text-align:center}
    .confirm-box h3{color:#f87171;font-size:17px;margin-bottom:10px}
    .confirm-box p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
    .confirm-btns{display:flex;gap:10px;justify-content:center}
  </style>
</head>
<body>
<div id="appNav"></div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">➕ Add New Student</h2>
    <div class="form-row"><label>Full Name *</label><input id="f_name" placeholder="e.g. Arjun Sharma"/></div>
    <div class="form-row"><label>Roll Number *</label><input id="f_roll" placeholder="e.g. CS2021001"/></div>
    <div class="form-row"><label>Email Address * (Login ID)</label><input id="f_email" type="email" placeholder="e.g. arjun@mits.edu" required/></div>
    <div class="form-row"><label>Branch</label>
      <select id="f_branch">
        <option value="CSE">CSE</option><option value="ECE">ECE</option><option value="ME">ME</option>
        <option value="CE">CE</option><option value="EEE">EEE</option>
      </select>
    </div>
    <div class="form-row"><label>Current Semester *</label>
      <select id="f_sem">
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3" selected>Semester 3</option>
      </select>
    </div>
    <div class="form-row"><label>Phone</label><input id="f_phone" placeholder="10-digit mobile number"/></div>
    <div class="err-msg" id="modalErr"></div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveStudent()">💾 Save Student</button>
    </div>
  </div>
</div>

<!-- Confirm Delete -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>⚠️ Delete Student?</h3>
    <p id="confirmMsg">This will permanently remove the student and all their marks. This action cannot be undone.</p>
    <div class="confirm-btns">
      <button class="btn btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">🗑️ Delete</button>
    </div>
  </div>
</div>

<main class="page">
  <div class="pg-header">
    <div>
      <h1>👥 Student Management</h1>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">➕ Add Student</button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="search-wrap">
      <input id="searchInput" placeholder="Search by name or roll number…" oninput="renderTable()"/>
    </div>
    <select id="semFilterStu" onchange="renderTable()">
      <option value="">All Semesters (1-3)</option>
      <option value="1">Sem 1</option>
      <option value="2">Sem 2</option>
      <option value="3">Sem 3</option>
    </select>
    <select id="branchFilter" onchange="renderTable()">
      <option value="">All Branches</option>
      <option>CSE</option><option>ECE</option><option>ME</option><option>CE</option><option>EEE</option>
    </select>
    <span class="count-badge" id="countBadge">0 students</span>
  </div>

  <!-- Table -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('rollNo')">#  Roll No ↕</th>
          <th onclick="sortBy('name')">Name ↕</th>
          <th>Branch</th>
          <th onclick="sortBy('currentSem')">Sem ↕</th>
          <th>Email</th>
          <th>CGPA</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="studentBody">
        <tr><td colspan="7" class="no-data"><span>⏳</span>Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
  initPage('students');

  let editId   = null;
  let sortKey  = 'rollNo';
  let sortAsc  = true;
  let deleteId = null;

  function renderTable() {
    const q      = document.getElementById('searchInput').value.trim().toLowerCase();
    const semF   = document.getElementById('semFilterStu').value;
    const branchF= document.getElementById('branchFilter').value;
    let students = RA.getStudents();

    if (q)       students = students.filter(s => s.name.toLowerCase().includes(q) || s.rollNo.toLowerCase().includes(q));
    if (semF)    students = students.filter(s => String(s.currentSem) === semF);
    if (branchF) students = students.filter(s => s.branch === branchF);

    students.sort((a,b) => {
      const av = a[sortKey] || '', bv = b[sortKey] || '';
      return sortAsc ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });

    document.getElementById('countBadge').textContent = students.length + ' student' + (students.length !== 1 ? 's' : '');

    const tbody = document.getElementById('studentBody');
    if (!students.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="no-data"><span>🔍</span>No students match your search</td></tr>';
      return;
    }

    tbody.innerHTML = students.map((s, i) => {
      const cgpa = RA.calcCGPA(s.id);
      const cgpaStr = cgpa > 0 ? cgpa.toFixed(2) : '—';
      const cgpaCol = cgpa >= 8 ? '#4ade80' : cgpa >= 6 ? '#facc15' : cgpa > 0 ? '#f87171' : 'rgba(186,230,253,0.4)';
      return '<tr>' +
        '<td><strong style="color:var(--sky)">' + RA.escHTML(s.rollNo) + '</strong></td>' +
        '<td><strong>' + RA.escHTML(s.name) + '</strong></td>' +
        '<td>' + RA.escHTML(s.branch) + '</td>' +
        '<td><span class="sem-badge">Sem ' + s.currentSem + '</span></td>' +
        '<td style="color:var(--muted);font-size:13px">' + RA.escHTML(s.email || '—') + '</td>' +
        '<td><strong style="color:' + cgpaCol + '">' + cgpaStr + '</strong></td>' +
        '<td><div class="action-btns">' +
          '<button class="btn btn-sm btn-edit" onclick="openEditModal(\'' + s.id + '\')">✏️ Edit</button>' +
          '<a class="btn btn-sm btn-edit" style="text-decoration:none" href="marks.html?sid=' + s.id + '">📝 Marks</a>' +
          '<button class="btn btn-sm btn-danger" onclick="confirmDelete(\'' + s.id + '\',\'' + RA.escHTML(s.name) + '\')">🗑️</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  function sortBy(key) {
    if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
    renderTable();
  }

  // ── Modal ──
  function openAddModal() {
    editId = null;
    document.getElementById('modalTitle').textContent = '➕ Add New Student';
    clearForm();
    document.getElementById('modalOverlay').classList.add('open');
  }

  function openEditModal(id) {
    editId = id;
    const s = RA.getStudent(id);
    if (!s) return;
    document.getElementById('modalTitle').textContent = '✏️ Edit Student';
    document.getElementById('f_name').value   = s.name;
    document.getElementById('f_roll').value   = s.rollNo;
    document.getElementById('f_email').value  = s.email || '';
    document.getElementById('f_branch').value = s.branch;
    document.getElementById('f_sem').value    = s.currentSem;
    document.getElementById('f_phone').value  = s.phone || '';
    document.getElementById('modalErr').style.display = 'none';
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  function clearForm() {
    ['f_name','f_roll','f_email','f_phone'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_branch').value = 'CSE';
    document.getElementById('f_sem').value    = '3';
    document.getElementById('modalErr').style.display = 'none';
  }

  function saveStudent() {
    const name       = document.getElementById('f_name').value.trim();
    const rollNo     = document.getElementById('f_roll').value.trim();
    const email      = document.getElementById('f_email').value.trim().toLowerCase();
    const branch     = document.getElementById('f_branch').value;
    const currentSem = +document.getElementById('f_sem').value;
    const phone      = document.getElementById('f_phone').value.trim();
    const errEl      = document.getElementById('modalErr');

    if (!name || !rollNo || !email) {
      errEl.textContent = 'Name, Roll Number, and Email Address are all required.';
      errEl.style.display = 'block';
      return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      errEl.textContent = 'Please enter a valid email address.';
      errEl.style.display = 'block';
      return;
    }

    const existing = RA.getStudents();
    const dupRoll = existing.find(s => s.rollNo.toLowerCase() === rollNo.toLowerCase() && s.id !== editId);
    if (dupRoll) {
      errEl.textContent = 'Roll number already exists (' + dupRoll.name + ').';
      errEl.style.display = 'block';
      return;
    }

    const dupEmail = existing.find(s => s.email && s.email.toLowerCase() === email.toLowerCase() && s.id !== editId);
    if (dupEmail) {
      errEl.textContent = 'A student with this email address already exists (' + dupEmail.name + ').';
      errEl.style.display = 'block';
      return;
    }

    const data = { name, rollNo, email, branch, currentSem, phone };
    if (editId) { RA.updateStudent(editId, data); } else { RA.addStudent(data); }
    closeModal();
    renderTable();
  }

  // ── Confirm Delete ──
  function confirmDelete(id, name) {
    deleteId = id;
    document.getElementById('confirmMsg').textContent = 'Delete "' + name + '" and all their marks? This cannot be undone.';
    document.getElementById('confirmOverlay').classList.add('open');
    document.getElementById('confirmOkBtn').onclick = function() {
      RA.deleteStudent(deleteId);
      closeConfirm();
      renderTable();
    };
  }

  function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
  document.getElementById('confirmOverlay').addEventListener('click', function(e) { if(e.target===this) closeConfirm(); });

  // Keyboard shortcut
  document.addEventListener('keydown', e => { if(e.key==='Escape') { closeModal(); closeConfirm(); } });

  renderTable();
</script>
</body>
</html>
