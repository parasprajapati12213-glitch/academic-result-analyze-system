  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #38BDF8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .loader {
      display: inline-block;
      width: 40px;
      height: 40px;

    a {
      color: #00F0FF;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
